<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05161a">
<meta name="description" content="Salt &amp; Powder — build the most feared fleet in the Caribbean.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Salt &amp; Powder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%2305161a'/%3E%3Cg fill='none' stroke='%23d9c98a' stroke-width='1.8'%3E%3Ccircle cx='12' cy='4.6' r='2'/%3E%3Cpath d='M12 6.8v13M7.4 10.4h9.2'/%3E%3Cpath d='M5 14c0 3.8 3.4 6 7 6s7-2.2 7-6'/%3E%3C/g%3E%3C/svg%3E">

<link rel="preload" href="fonts/cinzel-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/oswald-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="styles/fonts.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/hud.css">
<link rel="stylesheet" href="styles/screens.css">
<link rel="stylesheet" href="styles/battle.css">
<link rel="stylesheet" href="styles/overlays.css">

<!-- Vendored locally: no CDN dependency, and battles degrade to text if it
     ever fails to load rather than taking the whole game down with them. -->
<script src="vendor/phaser.min.js"></script>
</head>
<body>

<!-- ambient layers, behind everything -->
<canvas id="mist"></canvas>
<div id="vignette"></div>

<!-- the game proper; hidden until you leave the title screen -->
<div id="app">
  <header>
    <div class="hrow">
      <button class="iconbtn" id="pauseBtn" data-act="pause-open" aria-label="Ship's orders"></button>
      <div class="brand">Salt <span>&amp;</span> Powder</div>
      <div class="hspacer"></div>
    </div>
    <div class="res" id="resStrip"></div>
  </header>

  <main id="main"></main>
  <nav id="nav"></nav>
</div>

<!-- title screen -->
<div id="titleScr"></div>

<!-- after-action: its own screen, not a drawer -->
<div id="resultScr" class="panel">
  <div class="sheet-head" id="rHead"></div>
  <div class="sheet-body" id="rBody"></div>
  <div class="sheet-foot" id="rFoot"></div>
</div>

<!-- mission / result drawer -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-head" id="sheetHead"></div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot"></div>
  </div>
</div>

<!-- battle -->
<div id="battleScr">
  <div class="bhead">
    <div class="h" id="bTitle">Broadsides — Round 1</div>
    <div class="sub" id="bHint">Tap an enemy to target it, then choose one order below</div>
  </div>
  <div id="phaserHost"><div class="blog" id="blog"></div></div>
  <div class="bcmds" id="bcmds"></div>
  <div class="banner" id="banner"></div>
</div>

<!-- overlays -->
<div id="pauseScr"></div>
<div id="loadScr"></div>
<div id="wipe"><div class="p p1"></div><div class="p p2"></div></div>
<div id="tutHi"></div>
<div id="tutTip"></div>
<div id="safeProbe"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
