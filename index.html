<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Salt &amp; Powder</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#05161a;--panel:rgba(7,22,27,.88);--panel2:rgba(12,34,40,.9);--line:#164a52;--line2:#2a6b70;
--ink:#cfe3e4;--dim:#8fb0b3;--gold:#d9c98a;--goldhi:#efe3ae;--grn:#63c06a;--yel:#d9c34a;--org:#d9883a;--red:#d94a3a;--blu:#7ab0e0}
html,body{height:100%}
body{background:#020a0c;color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;
height:100dvh;display:flex;flex-direction:column;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#mist{position:fixed;inset:0;z-index:0}
header,main,nav{position:relative;z-index:1}
header{padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;background:linear-gradient(180deg,rgba(3,10,12,.95),rgba(6,20,24,.85));border-bottom:1px solid var(--line)}
.hrow{display:flex;justify-content:space-between;align-items:baseline}
h1{font-family:'Oswald',sans-serif;font-size:18px;font-weight:600;letter-spacing:3px;color:var(--ink)}
h1 small{color:var(--dim);font-size:14px;letter-spacing:1.5px;display:block;font-weight:400}
/* resource strip */
.ic{display:inline-block;vertical-align:-.25em;image-rendering:auto}
.btn .ic{margin-right:0;vertical-align:middle}
.res{display:flex;gap:5px;margin-top:9px}
.resitem{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;
background:rgba(0,0,0,.34);border:1px solid var(--line);border-radius:3px;padding:8px 2px 6px;
transition:transform .16s cubic-bezier(.2,2,.4,1),border-color .16s}
.resitem .ic{width:clamp(40px,11vw,58px);height:auto;margin-bottom:1px}
.resitem b{font-family:'Oswald',sans-serif;font-weight:500;color:var(--ink);line-height:1.15}
.resitem span{color:var(--dim);letter-spacing:1px;text-transform:uppercase;line-height:1.15;white-space:nowrap}
.resitem.bump{transform:scale(1.12);border-color:var(--gold)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;padding-bottom:22px;position:relative;background:var(--bg)}
main.nopad{padding:0;overflow:hidden}
nav{display:flex;justify-content:center;background:linear-gradient(0deg,rgba(2,8,10,.97),rgba(5,16,19,.9));
border-top:1px solid var(--line);padding:8px 8px calc(env(safe-area-inset-bottom) + 8px)}
nav button{font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:.5px;text-transform:uppercase;
background:rgba(10,28,33,.8);border:1px solid var(--line);color:var(--dim);padding:11px 2px;flex:1;transition:color .2s;position:relative}
nav button:first-child{border-radius:3px 0 0 3px}
nav button:last-child{border-radius:0 3px 3px 0}
nav button:not(:first-child){border-left:none}
nav button.on{background:linear-gradient(180deg,#14424a,#0d2e34);color:var(--goldhi);box-shadow:inset 0 0 12px rgba(120,220,230,.12);border-color:var(--line2)}
nav button.alert{color:var(--red);animation:navpulse 1.4s ease-in-out infinite}
@keyframes navpulse{50%{color:#ff9080;text-shadow:0 0 10px rgba(217,74,58,.8)}}
nav .badge{position:absolute;top:2px;right:6px;background:var(--gold);color:#0b1a1e;border-radius:10px;font-size:12px;padding:0 6px;line-height:17px;font-weight:600}
nav .badge.rdy{background:var(--grn);animation:navpulse 1.2s ease-in-out infinite}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:13px 15px;margin-bottom:11px;
box-shadow:0 3px 10px rgba(0,0,0,.45);animation:cardIn .45s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i,0)*70ms)}
.card::before{content:'';position:absolute;top:0;left:0;width:15px;height:15px;border-top:1px solid var(--line2);border-left:1px solid var(--line2)}
.card::after{content:'';position:absolute;bottom:0;right:0;width:15px;height:15px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2)}
.card.flagcard{border-color:#8a793e;box-shadow:0 3px 14px rgba(0,0,0,.5),inset 0 0 24px rgba(217,201,138,.07)}
.card.flagcard::before,.card.flagcard::after{border-color:var(--gold)}
.card.bosscard{border-color:#8a463e;box-shadow:0 3px 14px rgba(0,0,0,.5),inset 0 0 24px rgba(217,74,58,.08)}
.card.chartercard{border-color:#8a793e}
.card.atsea{border-color:#2c5a8a;opacity:.92}
.card.atsea::before,.card.atsea::after{border-color:var(--blu)}
.card.ready{border-color:#3f7a44;box-shadow:0 3px 14px rgba(0,0,0,.5),inset 0 0 24px rgba(99,192,106,.09)}
.card h3{font-family:'Oswald',sans-serif;font-size:17px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase}
.sub{font-size:14.5px;color:var(--dim);line-height:1.6}
.sub b{color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap}
.btnset{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}
.sect{font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:2.5px;color:var(--gold);text-transform:uppercase;
margin:18px 0 10px;display:flex;align-items:center;gap:10px;animation:cardIn .4s ease both;animation-delay:calc(var(--i,0)*70ms)}
.sect::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.btn{font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);
background:linear-gradient(180deg,#123a41,#0b262c);border:1px solid var(--line2);border-radius:2px;padding:10px 16px;
display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;line-height:1.15;
transition:transform .12s cubic-bezier(.2,2,.4,1)}
.btn:active{transform:scale(.93)}
.btn.gold{background:linear-gradient(180deg,#4a4023,#332b14);border-color:#8a793e;color:var(--goldhi)}
.btn.red{background:linear-gradient(180deg,#4a1d18,#2e110d);border-color:#8a463e;color:#f0b0a6}
.btn.blu{background:linear-gradient(180deg,#173c5e,#0d2338);border-color:#2c5a8a;color:#bcd8f0}
.btn.grn{background:linear-gradient(180deg,#1d4a22,#102e14);border-color:#3f7a44;color:#bce8bf}
.btn:disabled{opacity:.4}
.btn.sm{font-size:14px;padding:8px 12px}
.btn.wide{width:100%;padding:13px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
.relicgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.relic{border:1px solid #8a793e;background:rgba(58,47,20,.35);padding:8px 10px;font-size:14.5px;color:var(--goldhi);font-family:'Oswald';letter-spacing:.8px;
display:flex;align-items:center;gap:8px}
.bar{height:7px;background:#03181c;border:1px solid #0e3a40;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--grn);transition:width .5s cubic-bezier(.2,.9,.3,1)}
.bar i.low{background:var(--yel)}.bar i.crit{background:var(--red)}
.vbar{height:11px;background:#03181c;border:1px solid #0e3a40;overflow:hidden;margin-top:7px}
.vbar i{display:block;height:100%;background:linear-gradient(90deg,#2c5a8a,#7ab0e0);transition:width 1s linear}
.vbar.done i{background:linear-gradient(90deg,#3f7a44,#7fd08a)}
.secbar{height:8px;background:#03181c;border:1px solid #0e3a40;overflow:hidden;margin-top:6px}
.secbar i{display:block;height:100%;background:linear-gradient(90deg,#8a5a2c,#d9c98a);transition:width .6s ease}
.secbar.clear i{background:linear-gradient(90deg,#3f7a44,#7fd08a)}
.stats{display:flex;gap:14px;font-size:14px;color:var(--dim);margin-top:7px;letter-spacing:.4px;flex-wrap:wrap}
.stats b{color:var(--ink)}
.pips{color:var(--gold);letter-spacing:2px;font-size:16px}
.tag{font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:2px;text-transform:uppercase;padding:3px 9px;border-left:3px solid;color:var(--ink);background:rgba(0,0,0,.4)}
.t0{border-color:var(--grn);color:var(--grn)}.t1{border-color:var(--yel);color:var(--yel)}
.t2{border-color:var(--org);color:var(--org)}.t3{border-color:var(--red);color:var(--red)}
.tag.gold{border-color:var(--gold);color:var(--goldhi)}
.tag.blu{border-color:var(--blu);color:#bcd8f0}
.dbar{height:8px;background:#03181c;border:1px solid #0e3a40;margin-top:5px}
.dbar i{display:block;height:100%;transition:width 1.2s ease,background 1.2s ease}
.mtype{font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:1.5px;color:var(--dim);border:1px solid var(--line);padding:2px 9px;text-transform:uppercase}
.mtype.boss{color:#f0b0a6;border-color:#8a463e}
.mtype.gold{color:var(--goldhi);border-color:#8a793e}
.drift{color:var(--org);font-size:14px;font-style:italic;margin-top:5px}
.clock{font-family:'Oswald',sans-serif;font-size:17px;letter-spacing:2px;color:#bcd8f0}
.clock.done{color:var(--grn)}
/* hero */
.hero{position:relative;text-align:center;padding:22px 16px 18px;margin-bottom:12px;
background:radial-gradient(ellipse at 50% 60%,rgba(28,74,84,.55),rgba(4,14,17,.9) 70%);
border:1px solid #8a793e;border-radius:4px;overflow:hidden;animation:cardIn .5s cubic-bezier(.2,.9,.3,1.2) both}
.hero::before{content:'';position:absolute;left:-20%;right:-20%;bottom:-40px;height:120px;background:radial-gradient(ellipse at 50% 0,rgba(120,220,230,.16),transparent 70%)}
.hero img{position:relative;width:min(78%,340px);height:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.7));animation:heroBob 4.2s ease-in-out infinite;margin:0 auto}
@keyframes heroBob{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-9px) rotate(.6deg)}}
.hero .hname{position:relative;font-family:'Oswald',sans-serif;font-size:26px;letter-spacing:4px;text-transform:uppercase;color:var(--goldhi);text-shadow:0 2px 10px rgba(0,0,0,.8);margin-top:6px}
.hero .hsub{position:relative;font-size:14.5px;color:var(--dim);font-style:italic;margin-top:3px}
.hero .hstats{position:relative;display:flex;justify-content:center;gap:22px;margin-top:14px;flex-wrap:wrap}
.hero .hstat{text-align:center}
.hero .hstat b{display:block;font-family:'Oswald',sans-serif;font-size:24px;color:var(--ink)}
.hero .hstat span{font-size:14px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase}
/* map */
#mapwrap{position:absolute;inset:0;background:#04161c}
#mapsvg{width:100%;height:100%;display:block}
.legend{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:6px;width:210px}
.leg{background:rgba(3,12,15,.85);padding:6px 10px 7px;border:1px solid rgba(30,80,88,.5);animation:cardIn .4s ease both;animation-delay:calc(var(--i,0)*80ms)}
.legrow{display:flex;align-items:center;gap:7px;font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink)}
.legrow i{width:12px;height:12px;display:inline-block;flex-shrink:0}
.legmeta{display:flex;gap:10px;align-items:center;margin-top:4px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:1px;color:var(--dim)}
.legmeta span{display:flex;align-items:center;gap:3px}
.leg.lock .legrow{color:#5b787b}
.notobar{height:6px;background:#03181c;border:1px solid #0e3a40;margin-top:5px;overflow:hidden}
.notobar i{display:block;height:100%;background:linear-gradient(90deg,#8a5a2c,#d9c98a);transition:width .6s ease}
.notobar.full i{background:linear-gradient(90deg,#a02c22,#e06a5a)}
.legdone{font-size:14px;color:var(--gold);font-family:'Oswald';letter-spacing:1px;margin-top:4px}
.maphint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:14px;color:var(--ink);
background:rgba(3,12,15,.85);padding:7px 14px;border:1px solid rgba(30,80,88,.5);letter-spacing:.6px;
width:max-content;max-width:calc(100% - 24px);text-align:center;line-height:1.5}
@keyframes dashmove{to{stroke-dashoffset:-40}}
.routeline{stroke-dasharray:3 7;animation:dashmove 3s linear infinite;fill:none}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.7}}
.nodeglow{animation:pulse 2.4s ease-in-out infinite}
@keyframes bosspulse{0%,100%{opacity:.3}50%{opacity:.85}}
.bossglow{animation:bosspulse 1.3s ease-in-out infinite}
@keyframes starpulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
.charterstar{animation:starpulse 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes sailmove{to{stroke-dashoffset:-24}}
.voyline{stroke-dasharray:6 5;animation:sailmove 1.1s linear infinite;fill:none}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(2,8,10,0);backdrop-filter:blur(0);display:none;align-items:flex-end;justify-content:center;z-index:10;transition:background .3s,backdrop-filter .3s}
.overlay.on{display:flex}
.overlay.vis{background:rgba(2,8,10,.7);backdrop-filter:blur(2px)}
.sheet{width:100%;max-width:580px;max-height:88dvh;display:flex;flex-direction:column;
background:linear-gradient(180deg,rgba(9,28,33,.97),rgba(4,14,17,.98));border-top:2px solid var(--line2);border-radius:6px 6px 0 0;
box-shadow:0 -8px 40px rgba(0,0,0,.8);transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1.05)}
.overlay.vis .sheet{transform:none}
.sheet-head{padding:15px 18px 12px;border-bottom:1px solid var(--line)}
.sheet-head h3{font-family:'Oswald',sans-serif;font-size:19px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--goldhi)}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px calc(env(safe-area-inset-bottom) + 18px)}
.modetabs{display:flex;margin-bottom:12px}
.modetabs button{flex:1;font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;
background:rgba(10,28,33,.8);border:1px solid var(--line);color:var(--dim);padding:10px 0}
.modetabs button:first-child{border-radius:3px 0 0 3px}
.modetabs button:last-child{border-radius:0 3px 3px 0;border-left:none}
.modetabs button.on{background:linear-gradient(180deg,#14424a,#0d2e34);color:var(--goldhi);border-color:var(--line2)}
.pick{border:1px solid var(--line);border-radius:3px;padding:10px 12px;margin-bottom:9px;background:var(--panel2);transition:border-color .2s,box-shadow .2s,transform .15s}
.pick:active{transform:scale(.98)}
.pick.sel{border-color:var(--gold);box-shadow:0 0 10px rgba(217,201,138,.25),inset 0 0 10px rgba(217,201,138,.08)}
.pick.dis{opacity:.35}
.pick.flag{border-left:3px solid var(--gold)}
.pick b{font-family:'Oswald',sans-serif;font-weight:500;letter-spacing:1px;font-size:16px;text-transform:uppercase}
.slot{font-family:'Oswald',sans-serif;font-size:14px;color:var(--gold);letter-spacing:1.5px;border:1px solid #8a793e;padding:2px 8px}
.slot.blu{color:#bcd8f0;border-color:#2c5a8a}
.evt{border-left:3px solid var(--line2);background:rgba(12,34,40,.6);padding:9px 12px;margin-top:10px;font-size:14.5px;font-style:italic;color:#a8c8ca;line-height:1.6}
.evt.noto{border-color:var(--gold);color:var(--gold)}
.evt.prize{border-color:#8a793e;color:var(--goldhi);font-style:normal}
.shipsvg{display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.fleetship{flex-shrink:0}
.shipsvg.sea{filter:grayscale(.45) brightness(.75) drop-shadow(0 3px 4px rgba(0,0,0,.5))}
/* battle */
#battleScr{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;background:radial-gradient(ellipse at 50% 30%,#12383e 0%,#0a2328 45%,#04141a 100%)}
#battleScr.on{display:flex}
#battleScr.boss{background:radial-gradient(ellipse at 50% 30%,#3a1c1c 0%,#1e1012 45%,#0a0507 100%)}
#phaserHost{position:relative;flex:1;min-height:0}
#phaserHost canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.bhead{position:relative;text-align:center;padding:calc(env(safe-area-inset-top) + 12px) 14px 5px;z-index:2}
.bhead .h{font-family:'Oswald',sans-serif;font-weight:500;text-transform:uppercase;font-size:18px;color:var(--goldhi);letter-spacing:3px}
.bhead .sub{font-size:14px;letter-spacing:1px}
.bhead .warn{color:#ff9080;font-family:'Oswald';font-size:15px;letter-spacing:2px;text-transform:uppercase;animation:navpulse 1s ease-in-out infinite}
.blog{position:relative;padding:6px 16px;font-size:14.5px;font-style:italic;color:#a8c8ca;line-height:1.6;text-align:center;min-height:64px;text-shadow:0 1px 3px #000;z-index:2}
.blog .good{color:var(--grn)}.blog .bad{color:#e88a7a}
.bcmds{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 14px calc(env(safe-area-inset-bottom) + 14px);z-index:2}
.bcmds.busy{pointer-events:none;opacity:.55}
.banner{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;
background:rgba(3,10,12,.72);backdrop-filter:blur(2px);text-align:center;padding:22px}
.banner.on{display:flex}
@keyframes bigIn{0%{transform:scale(2.4);opacity:0}60%{transform:scale(.92);opacity:1}100%{transform:scale(1)}}
.banner .big{font-family:'Oswald',sans-serif;font-size:34px;font-weight:600;letter-spacing:5px;text-transform:uppercase;text-shadow:0 0 24px currentColor;animation:bigIn .55s cubic-bezier(.2,.9,.3,1.2) both}
.banner .stat{width:min(320px,82%);margin-top:16px}
.banner .stat .lbl{display:flex;justify-content:space-between;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);font-family:'Oswald',sans-serif}
.rewrow{display:flex;gap:16px;margin-top:14px;font-family:'Oswald',sans-serif;font-size:17px;color:var(--goldhi);letter-spacing:1px;animation:cardIn .5s .25s ease both;flex-wrap:wrap;justify-content:center}
.rewrow span{display:flex;align-items:center;gap:5px}
.center{text-align:center}
/* single sweep wipe */
#wipe{position:fixed;inset:0;z-index:40;pointer-events:none;visibility:hidden}
#wipe.go{visibility:visible}
#wipe .p{position:absolute;top:-10%;bottom:-10%;width:170%;left:-230%;transform:skewX(-11deg);transition:none}
#wipe .p1{background:linear-gradient(90deg,#0d3138,#0a2328)}
#wipe .p2{background:linear-gradient(90deg,#164a52,#0d3138)}
#wipe.go .p1{left:120%;transition:left .62s cubic-bezier(.55,.05,.3,1)}
#wipe.go .p2{left:120%;transition:left .62s cubic-bezier(.55,.05,.3,1) .07s}
/* toasts */
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none;width:min(92vw,460px)}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px) scale(.94)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}
.toast{background:linear-gradient(180deg,rgba(12,34,40,.97),rgba(5,16,20,.97));border:1px solid var(--line2);border-radius:3px;
padding:10px 16px;font-size:14.5px;box-shadow:0 6px 20px rgba(0,0,0,.6);animation:toastIn .3s cubic-bezier(.2,.9,.3,1.3) both;max-width:100%;text-align:center}
.toast.gold{border-color:#8a793e;color:var(--goldhi)}
.toast.bad{border-color:#8a463e;color:#f0b0a6}
.toast.blu{border-color:#2c5a8a;color:#bcd8f0}
.toast.bye{animation:toastOut .25s ease both}
.coin{position:fixed;z-index:45;width:15px;height:15px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 35% 30%,#f5e2a0,#b8863b);box-shadow:0 0 6px rgba(240,200,100,.8)}
/* tutorial */
#tutHi{position:fixed;z-index:29;display:none;pointer-events:none;border:2px solid var(--gold);border-radius:6px;
box-shadow:0 0 0 9999px rgba(2,8,10,.62),0 0 14px rgba(217,201,138,.55);animation:tutpulse 1.8s ease-in-out infinite}
#tutHi.full{border:none;border-radius:0;box-shadow:none;background:rgba(2,8,10,.66);animation:none;inset:0;left:0!important;top:0!important;width:100%!important;height:100%!important}

<script>
'use strict';
/* ============ TUNING ============ */
const SEC_PER_WIN=45, SEC_DECAY_PER_MIN=1.0, VOY_SEC_PER_DAY=90, VOY_MAX_ACTIVE=6, RUSH_GEM_PER_MIN=1;
const CARGO_PRICE=12;

/* ============ ASSETS ============ */
const ART_COMBOS=[['schooner','player'],['brig','player'],['frigate','player'],['manowar','player'],
 ['schooner','enemy'],['brig','enemy'],['frigate','enemy'],['manowar','enemy'],

const SND_PATHS={ui_tap:'audio/ui_tap.mp3',cannon:'audio/cannon.mp3',impact:'audio/impact.mp3',

  victory:'audio/victory.mp3',defeat:'audio/defeat.mp3',board:'audio/board.mp3',repair:'audio/repair.mp3',
  toast:'audio/toast.mp3',ambience:'audio/ambience.mp3',boss_horn:'audio/boss_horn.mp3',

/* ============ ICON ART (placeholder images) ============

 reales:c=>`<circle cx="12" cy="12" r="8.5" fill="${c}"/><circle cx="12" cy="12" r="5.4" fill="none" stroke="#3a2f14" stroke-width="1.5"/><path d="M9.4 12h5.2" stroke="#3a2f14" stroke-width="1.5"/>`,

 sea:c=>`<path d="M12.6 4l6 10.2h-6z" fill="${c}"/><path d="M11.2 4v10.2" stroke="${c}" stroke-width="1.7"/><path d="M10.4 6.5l-4.6 7.7h4.6z" fill="${c}" opacity=".7"/><path d="M3.4 16.4h17.2l-2.6 4.2H6z" fill="${c}" opacity=".8"/>`,
 plate:c=>`<path d="M12 3l7.5 2.6v5.7c0 4.4-3 7.9-7.5 9.4-4.5-1.5-7.5-5-7.5-9.4V5.6z" fill="${c}"/><path d="M12 6.6v11" stroke="#05161a" stroke-width="1.3" opacity=".5"/>`,
 guns:c=>`<rect x="3.5" y="8.6" width="13" height="4.6" rx="1" fill="${c}"/><circle cx="18.4" cy="10.9" r="2.3" fill="${c}"/><circle cx="8.4" cy="17.2" r="3.1" fill="none" stroke="${c}" stroke-width="1.8"/>`,
 rig:c=>`<path d="M11.4 2.6v18.8" stroke="${c}" stroke-width="1.7"/><path d="M12.7 4.4l5.9 6h-5.9zM12.7 12l5.9 6.4h-5.9z" fill="${c}"/><path d="M10.1 5.2l-4.7 5.2h4.7zM10.1 12.6l-4.7 5.8h4.7z" fill="${c}" opacity=".68"/>`,
 hold:c=>`<rect x="3.5" y="6.5" width="17" height="12" rx="1.5" fill="${c}"/><path d="M3.5 10.6h17M3.5 14.6h17M8.6 6.5v12M15.4 6.5v12" stroke="#2a1f12" stroke-width="1.2"/>`,
 relic:c=>`<path d="M8.2 3h7.6v2h-2.1c2.9 1.5 4.6 4.1 4.6 7.1 0 4.4-3.1 7.9-6.3 7.9s-6.3-3.5-6.3-7.9c0-3 1.7-5.6 4.6-7.1H8.2z" fill="${c}"/><path d="M9 20.6h6" stroke="${c}" stroke-width="1.8"/>`,
 flag:c=>`<path d="M6.2 2.4v19.2" stroke="${c}" stroke-width="1.9"/><path d="M7.6 4h11l-3 4 3 4h-11z" fill="${c}"/>`,
 star:c=>`<path d="M12 2.4l2.7 6.4 6.9.5-5.3 4.5 1.7 6.8L12 16.9 6 20.6l1.7-6.8-5.3-4.5 6.9-.5z" fill="${c}"/>`,
 anchor:c=>`<circle cx="12" cy="4.4" r="2.2" fill="none" stroke="${c}" stroke-width="1.8"/><path d="M12 6.6v14M7 10.2h10" stroke="${c}" stroke-width="1.8"/><path d="M4.4 14.2c0 4 3.6 6.3 7.6 6.3s7.6-2.3 7.6-6.3" fill="none" stroke="${c}" stroke-width="1.8"/>`};
const ICON_URL={};
function svgIcon(name){const c=ICON_COLOR[name]||'#cfe3e4';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="160" height="160">${(ICONS[name]||ICONS.reales)(c)}</svg>`;}
function iconHTML(name,size,cls){
  const st=size?`style="width:${size}px;height:${size}px"`:'';
  return `<img class="ic ${cls||''}" alt="" ${st} src="${ICON_URL[name]||('data:image/svg+xml;utf8,'+encodeURIComponent(svgIcon(name)))}">`;}
function loadIconArt(){
  return Promise.all(Object.keys(ICONS).map(name=>new Promise(res=>{
    const im=new Image();
    im.onload=()=>{ICON_URL[name]='img/icon_'+name+'.png';res();};
    im.onerror=()=>res();
    im.src='img/icon_'+name+'.png';})));}

/* ============ SOUND ============ */
const Snd=(()=>{
  let ctx=null,files={},amb=null;
  function ac(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();return ctx;}
  Object.entries(SND_PATHS).forEach(([k,src])=>{const a=new Audio();
    a.addEventListener('canplaythrough',()=>files[k]=src,{once:true});
    a.addEventListener('error',()=>{},{once:true});a.src=src;});
  function env(g,t,a,d,v){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.001,t+a+d);}
  function osc(type,f0,f1,a,d,v){const c=ac(),o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,c.currentTime);
    if(f1)o.frequency.exponentialRampToValueAtTime(f1,c.currentTime+a+d);
    env(g,c.currentTime,a,d,v);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+a+d+.05);}
  function noise(d,ft,f,v){const c=ac(),len=c.sampleRate*d,buf=c.createBuffer(1,len,c.sampleRate),ch=buf.getChannelData(0);
    for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);
    const s=c.createBufferSource();s.buffer=buf;const fl=c.createBiquadFilter();fl.type=ft;fl.frequency.value=f;
    const g=c.createGain();g.gain.value=v;s.connect(fl).connect(g).connect(c.destination);s.start();}
  const synth={
    ui_tap:()=>osc('square',880,660,.005,.05,.06),
    cannon:()=>{noise(.35,'lowpass',420,.5);osc('sine',90,42,.01,.3,.5);},
    impact:()=>{noise(.12,'bandpass',900,.35);osc('sine',140,70,.005,.1,.3);},
    explosion:()=>{noise(.5,'lowpass',600,.6);osc('sine',70,30,.01,.45,.55);},
    splash:()=>noise(.45,'bandpass',700,.3),
    coin:()=>{osc('sine',1320,0,.005,.09,.18);setTimeout(()=>osc('sine',1760,0,.005,.12,.18),70);},
    sail:()=>noise(.6,'bandpass',500,.22),
    victory:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>osc('square',f,0,.01,.22,.14),i*110));},
    defeat:()=>{osc('sawtooth',220,110,.02,.6,.2);setTimeout(()=>osc('sawtooth',165,82,.02,.8,.2),250);},
    board:()=>{noise(.2,'highpass',1500,.25);osc('square',330,220,.01,.15,.12);},
    repair:()=>{[440,440,520].forEach((f,i)=>setTimeout(()=>osc('triangle',f,0,.005,.08,.15),i*90));},
    toast:()=>osc('triangle',990,1180,.01,.12,.1),
    upgrade:()=>{[440,554,659,880].forEach((f,i)=>setTimeout(()=>osc('triangle',f,0,.005,.16,.13),i*80));},
    boss_horn:()=>{osc('sawtooth',110,82,.08,1.1,.22);setTimeout(()=>osc('sawtooth',82,62,.08,1.4,.2),340);},
    telegraph:()=>{[880,880,880].forEach((f,i)=>setTimeout(()=>osc('square',f,0,.005,.1,.12),i*150));},
    relic:()=>{[660,880,1100,1320,1760].forEach((f,i)=>setTimeout(()=>osc('sine',f,0,.005,.25,.12),i*90));},
    depart:()=>{noise(.7,'bandpass',420,.24);setTimeout(()=>osc('sine',196,262,.05,.5,.1),120);},
    arrive:()=>{[392,523,659].forEach((f,i)=>setTimeout(()=>osc('triangle',f,0,.01,.2,.13),i*110));},
  };
  function play(k){try{
    if(files[k]){const a=new Audio(files[k]);a.volume=.7;a.play().catch(()=>{});}
    else if(synth[k]){ac();synth[k]();}}catch(e){}}
  function ambience(on){
    if(on&&files.ambience&&!amb){amb=new Audio(files.ambience);amb.loop=true;amb.volume=.35;amb.play().catch(()=>{});}
    if(!on&&amb){amb.pause();amb=null;}}
  addEventListener('pointerdown',()=>{try{ac().resume();}catch(e){}},{once:true});
  return {play,ambience};
})();
document.addEventListener('pointerdown',e=>{if(e.target.closest('.btn,nav button,.pick,.modetabs button'))Snd.play('ui_tap');});

/* ============ UI FX ============ */
function toast(msg,type){
  const t=document.createElement('div');t.className='toast '+(type||'');t.textContent=msg;
  document.getElementById('toasts').appendChild(t);
  Snd.play(type==='gold'?'coin':'toast');
  setTimeout(()=>{t.classList.add('bye');setTimeout(()=>t.remove(),260);},3000);}
let wiping=false;
function wipe(mid){
  if(wiping){mid&&mid();return;}
  wiping=true;const w=document.getElementById('wipe');Snd.play('sail');
  w.classList.remove('go');void w.offsetWidth;
  w.classList.add('go');
  setTimeout(()=>{mid&&mid();},330);
  setTimeout(()=>{w.classList.remove('go');wiping=false;},700);}
function coinFly(n){
  const tgt=document.getElementById('rReales').getBoundingClientRect();
  for(let i=0;i<Math.min(n,12);i++){
    const c=document.createElement('div');c.className='coin';
    const sx=innerWidth/2+(Math.random()-.5)*140,sy=innerHeight*0.55+(Math.random()-.5)*80;
    c.style.left=sx+'px';c.style.top=sy+'px';document.body.appendChild(c);
    const dx=tgt.left+8-sx,dy=tgt.top+8-sy;
    c.animate([{transform:'translate(0,0) scale(1)',opacity:1},
      {transform:`translate(${dx*.4}px,${dy*.4-60}px) scale(1.15)`,opacity:1,offset:.45},
      {transform:`translate(${dx}px,${dy}px) scale(.5)`,opacity:.9}],
      {duration:650+i*60,easing:'cubic-bezier(.3,.6,.4,1)',fill:'forwards'});
    setTimeout(()=>{c.remove();if(i===0)Snd.play('coin');bump('wReales');},650+i*60);}}
function bump(id){const el=document.getElementById(id);if(!el)return;
  el.classList.add('bump');setTimeout(()=>el.classList.remove('bump'),180);}
(function(){const cv=document.getElementById('mist'),cx=cv.getContext('2d');let W,H;

function svgShip(type,palette){
  const c=SHIPCFG[type],W=c.L+18,Ht=c.H+30,hy=Ht-16;
  const [sail,sail2,flag,hull]=PALETTES[palette];const trim='#3d3020';
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${Ht}" width="${W*3}" height="${Ht*3}">`;
  c.masts.forEach(mx=>{
    s+=`<line x1="${mx}" y1="${hy}" x2="${mx}" y2="${hy-c.H}" stroke="${hull}" stroke-width="2"/>`;
    if(c.rig==='sq'){
      const w1=c.L*0.30,w2=c.L*0.24,h1=c.H*0.34,h2=c.H*0.28,y1=hy-c.H*0.42,y2=hy-c.H*0.82;
      s+=`<path d="M${mx-w1/2},${y1} Q${mx},${y1+5} ${mx+w1/2},${y1} L${mx+w1/2},${y1-h1} Q${mx},${y1-h1+4} ${mx-w1/2},${y1-h1} Z" fill="${sail}"/>`;
      s+=`<path d="M${mx-w2/2},${y2} Q${mx},${y2+4} ${mx+w2/2},${y2} L${mx+w2/2},${y2-h2} Q${mx},${y2-h2+3} ${mx-w2/2},${y2-h2} Z" fill="${sail2}"/>`;
    }else{
      s+=`<path d="M${mx+1},${hy-4} L${mx+1},${hy-c.H+4} L${mx+c.L*0.30},${hy-8} Z" fill="${sail}"/>`;
      s+=`<path d="M${mx-1},${hy-c.H*0.45} L${mx-1},${hy-c.H+2} L${mx-c.L*0.20},${hy-c.H*0.45} Z" fill="${sail2}"/>`;}
    s+=`<path d="M${mx},${hy-c.H} l6,2 l-6,2 Z" fill="${flag}"/>`;});
  s+=`<path d="M4,${hy-6} L${W-14},${hy-6} L${W-3},${hy-13} L${W-11},${hy+4} Q${W/2},${hy+11} 12,${hy+4} Z" fill="${hull}" stroke="${trim}" stroke-width="1"/>`;
  const n=type==='manowar'?7:(type==='flagship'?6:(type==='frigate'?5:(type==='brig'?4:0)));
  for(let i=0;i<n;i++)s+=`<rect x="${16+i*(c.L-26)/Math.max(1,n-1)}" y="${hy-3}" width="2.6" height="2.6" fill="${palette==='flag'?'#d9c98a':'#4a3a22'}"/>`;
  return s+'</svg>';}
const SHIP_URL={},SHIP_CANVAS={},SHIP_DIM={};
function shipHTML(type,palette,scale,cls){
  const key=type+'_'+palette,c=SHIPCFG[type],W=c.L+18;

function loadShipArt(){

    const key=type+'_'+pal,c=SHIPCFG[type],W=c.L+18,H=c.H+30;SHIP_DIM[key]={w:W,h:H};

    user.src=IMG_PATHS[key];

          <span style="font-family:'Oswald';font-size:14px;letter-spacing:1.5px;color:${bz?'var(--blu)':condColor(c)}">${bz?'AT SEA':c}</span></div>
        <div class="sub">${tname(s)} · Power ${power(s)}${bz?` · ${v.routeName}`:''}</div>
        ${hullBar(s)}
        <div class="stats"><span>SPD <b>${s.speed}</b></span><span>GUNS <b>${s.guns}</b></span><span>HULL <b>${Math.max(0,s.hull)}/${s.max}</b></span><span>CARGO <b>${s.cargo}</b></span></div>
        ${bz?`<div class="row" style="margin-top:11px"><span class="sub">Home in</span>
              <span class="clock" data-endsat="${v.endsAt}">${fmtDur((v.endsAt-now())/1000)}</span></div>`
            :`<div class="row" style="margin-top:11px">
          <button class="btn sm" ${s.hull>=s.max?'disabled':''} onclick="doRepair('${s.id}')">Repair · ${iconHTML('reales',19)}${repairCost(s)}</button>
          <button class="btn sm red" onclick="doScrap('${s.id}')">Scuttle · ${iconHTML('parts',19)}${TYPES[s.type].salv}</button></div>`}
      </div></div></div>`;});
  $('main').innerHTML=h;}
function doRepair(id){const s=findShip(id);if(!s)return;
  if(isBusy(id))return toast('That ship is away trading. Wait for it to return.','bad');
  const c=repairCost(s);
  if(S.reales<c)return toast('Not enough reales to repair that ship.','bad');
  S.reales-=c;s.hull=s.max;Snd.play('repair');
  toast('The '+s.name+' is fully repaired.');render();}
function doScrap(id){if(id==='FLAG')return;
  if(isBusy(id))return toast('That ship is away trading. Wait for it to return.','bad');
  const s=findShip(id);
  if(!confirm('Scuttle the '+s.name+' for '+TYPES[s.type].salv+' parts? This cannot be undone.'))return;
  S.parts+=TYPES[s.type].salv;S.ships=S.ships.filter(x=>x.id!==id);
  toast('The '+s.name+' scuttled for '+TYPES[s.type].salv+' parts.');render();}

  h+=`<div class="sect" style="--i:${i++}">Upgrades</div>`;

      <div style="flex:1"><h3>${iconHTML(d.icon,30)} ${d.n}</h3>
        <div class="sub">${d.desc}<br><span class="pips">${'●'.repeat(t)}${'○'.repeat(MAXTIER-t)}</span></div></div>
      <button class="btn sm gold" ${can?'':'disabled'} onclick="upFlag('${k}')">${maxed?'MAX':costStr(cost)}</button></div></div>`;});
  h+=`<div class="sect" style="--i:${i++}">Fittings</div>`;
  Object.entries(FITTINGS).forEach(([k,d])=>{
    const owned=hasFit(k),can=!owned&&canPay(d.cost);
    h+=`<div class="card" style="--i:${i++};${owned?'border-color:#8a793e':''}"><div class="row">

  h+=S.relics.length
    ?`<div class="relicgrid" style="animation:cardIn .4s ease both">${S.relics.map(r=>`<div class="relic">${iconHTML('relic',26)}${r}</div>`).join('')}</div>`
    :`<div class="card sub" style="--i:${i++}">No relics yet. Relics are rewards from charters — the gold stars on the map.</div>`;

function upFlag(k){const t=S.flag.tiers[k];if(t>=MAXTIER)return;

function buyFit(k){if(hasFit(k))return;const d=FITTINGS[k];
  if(!canPay(d.cost))return toast('Not enough to pay for that upgrade.','bad');
  pay(d.cost);S.flag.fittings.push(k);Snd.play('upgrade');
  toast(d.n+' fitted aboard the '+S.flag.name+'.','gold');render();}
function renameFlag(){const n=prompt('What will you call her?',S.flag.name);
  if(n&&n.trim()){S.flag.name=n.trim().slice(0,20);toast('Flagship renamed to '+S.flag.name+'.');render();}}

/* ============ MAP ============ */
function starPath(x,y,r){return `M${x},${y-r} L${x+r*0.35},${y-r*0.35} L${x+r},${y} L${x+r*0.35},${y+r*0.35} L${x},${y+r} L${x-r*0.35},${y+r*0.35} L${x-r},${y} L${x-r*0.35},${y-r*0.35} Z`;}
function nodeShapeS(r,col,k){const {x,y}=r,s=5.5*k;
  if(r.type==='patrol')return `<rect x="${x-s}" y="${y-s}" width="${s*2}" height="${s*2}" transform="rotate(45 ${x} ${y})" fill="${col}" stroke="rgba(0,0,0,.5)" stroke-width="1.2"/>`;
  if(r.type==='raid'||r.type==='blockade')return `<path d="M${x},${y-s*1.35} L${x+s*1.2},${y+s*0.85} L${x-s*1.2},${y+s*0.85} Z" fill="${col}" stroke="rgba(0,0,0,.5)" stroke-width="1.2"/>`;
  if(r.type==='salvage')return `<circle cx="${x}" cy="${y}" r="${s}" fill="none" stroke="${col}" stroke-width="${2.8*k}"/>`;
  if(r.type==='escort')return `<rect x="${x-s}" y="${y-s}" width="${s*2}" height="${s*2}" fill="${col}" stroke="rgba(0,0,0,.5)" stroke-width="1.2"/>`;
  return `<circle cx="${x}" cy="${y}" r="${s}" fill="${col}" stroke="rgba(0,0,0,.5)" stroke-width="1.2"/><circle cx="${x}" cy="${y}" r="${2*k}" fill="#eaf4f4"/>`;}
function isWideMap(){return innerWidth>=900&&innerWidth>innerHeight;}
function renderMap(){
  const host=$('main');
  const CW=Math.max(320,host.clientWidth||innerWidth);
  const CH=Math.max(300,host.clientHeight||(innerHeight-190));
  const wide=CW>=760;
  const legW=wide?Math.min(320,CW*0.17)+46:0;
  const padX=Math.max(64,CW*0.06), padTop=Math.max(52,CH*0.09), padBot=Math.max(84,CH*0.14);
  const x0=padX+legW, x1=CW-padX, y0=padTop, y1=CH-padBot;
  const MX=x=>+(x0+(x/360)*(x1-x0)).toFixed(1);
  const MY=y=>+(y0+(y/560)*(y1-y0)).toFixed(1);
  const NR=Math.max(1.0,Math.min(CW/900,CH/620)*1.5);
  const LBL=Math.max(16,Math.round(13*NR)), HLBL=Math.max(18,Math.round(14.5*NR));
  const LSX=CW/360, LSY=CH/560;
  let lines='',nodes='',bossNodes='',voyLines='';
  const active={};S.voyages.forEach(v=>{active[v.routeId]=v;});
  const hx=MX(HOME.x),hy=MY(HOME.y);
  allRoutes().forEach(r=>{
    const d=effDanger(r),col=DHEX[d],isCh=r.type==='charter',open=voyageOpen(r);
    const x=MX(r.x),y=MY(r.y);
    lines+=`<path class="routeline" d="M${hx},${hy} L${x},${y}" stroke="${col}" stroke-width="${1.6*NR}" opacity="0.7"/>`;
    if(active[r.id])voyLines+=`<path class="voyline" d="M${hx},${hy} L${x},${y}" stroke="#7ab0e0" stroke-width="${2.4*NR}" opacity="0.95"/>`;
    const isPort=r.id.startsWith('pt_')||isCh;
    nodes+=`<g id="node_${r.id}" onclick="openMission('${r.id}')" style="cursor:pointer">
      <circle cx="${x}" cy="${y}" r="${22*NR}" fill="transparent"/>
      ${isCh?`<path class="charterstar" d="${starPath(x,y,10*NR)}" fill="#efe3ae" stroke="#8a793e" stroke-width="1.4"/>`
        :`<circle class="nodeglow" cx="${x}" cy="${y}" r="${13*NR}" fill="${col}"/>${nodeShapeS({...r,x,y},col,NR)}`}
      ${open&&!isCh?`<circle cx="${x+10*NR}" cy="${y-10*NR}" r="${4.2*NR}" fill="#63c06a" stroke="#04161c" stroke-width="1.3"/>`:''}
      ${active[r.id]?`<circle cx="${x-10*NR}" cy="${y-10*NR}" r="${4.2*NR}" fill="#7ab0e0" stroke="#04161c" stroke-width="1.3"/>`:''}
      ${isPort?`<text x="${x}" y="${y+20*NR+LBL}" text-anchor="middle" fill="${isCh?'#efe3ae':'#a8c4c6'}" font-size="${LBL}" font-family="Oswald" letter-spacing="1" style="paint-order:stroke" stroke="#04161c" stroke-width="3">${(isCh?PORTS[r.charterDef.loc].n:PORTS[r.id.slice(3)].n).toUpperCase()}</text>`:''}
    </g>`;});
  Object.keys(REGIONS).forEach(rk=>{
    if(!S.unlocked.includes(rk))return;
    const b=BOSSES[rk];if(!b)return;
    const x=MX(b.x),y=MY(b.y);
    if(S.bossBeaten[rk]){
      bossNodes+=`<g><circle cx="${x}" cy="${y}" r="${9*NR}" fill="none" stroke="#d9c98a" stroke-width="1.8" opacity=".6"/>
        <path d="M${x-3.5*NR},${y-5*NR} v${10*NR} M${x-3.5*NR},${y-5*NR} h${7.5*NR} l${-2.4*NR},${2.6*NR} l${2.4*NR},${2.6*NR} h${-7.5*NR}"
          fill="#d9c98a" stroke="#d9c98a" stroke-width="${1.2*NR}" stroke-linejoin="round"/></g>`;return;}
    if(!bossReady(rk))return;
    lines+=`<path class="routeline" d="M${hx},${hy} L${x},${y}" stroke="#d94a3a" stroke-width="${2*NR}" opacity="0.9"/>`;
    bossNodes+=`<g id="node_${b.id}" onclick="openMission('${b.id}')" style="cursor:pointer">
      <circle cx="${x}" cy="${y}" r="${26*NR}" fill="transparent"/>
      <circle class="bossglow" cx="${x}" cy="${y}" r="${18*NR}" fill="#d94a3a"/>
      <path d="${starPath(x,y,10*NR)}" fill="#f0b0a6" stroke="#5e1a1a" stroke-width="1.4"/>
      <text x="${x}" y="${y+24*NR+LBL}" text-anchor="middle" fill="#f0b0a6" font-size="${LBL}" font-family="Oswald" letter-spacing="1.2" style="paint-order:stroke" stroke="#0a0507" stroke-width="3">${b.n.toUpperCase()}</text></g>`;});
  let li=0;
  const legend=Object.keys(REGIONS).map(rk=>{li++;
    if(!S.unlocked.includes(rk))return `<div class="leg lock" style="--i:${li}"><div class="legrow"><i style="background:#173238"></i><span>LOCKED — ${REGIONS[rk].n}</span></div></div>`;
    const rs=allRoutes().filter(r=>r.region===rk);
    const maxd=rs.length?Math.max(...rs.map(r=>effDanger(r))):0;
    const b=BOSSES[rk],need=b?b.noto:1,cur=Math.min(S.noto[rk]||0,need),done=S.bossBeaten[rk];
    const chn=CHARTERS.filter(c=>PORTS[c.loc].region===rk&&charterAvailable(c)).length;
    const openN=rs.filter(voyageOpen).length;
    const meta=[(S.patrol[rk]||0)>0?`<span>${iconHTML('flag',18)}PATROL</span>`:'',
      chn?`<span style="color:#efe3ae">${iconHTML('star',18)}${chn}</span>`:'',
      openN?`<span style="color:#63c06a">${iconHTML('anchor',18)}${openN}</span>`:''].filter(Boolean).join('');
    return `<div class="leg" style="--i:${li}">
      <div class="legrow"><i style="background:${DHEX[maxd]}"></i><span>${REGIONS[rk].n}</span></div>
      ${meta?`<div class="legmeta">${meta}</div>`:''}
      ${done?`<div class="legdone">${b.n} DEFEATED</div>`
        :`<div class="notobar ${cur>=need?'full':''}"><i style="width:${cur/need*100}%"></i></div>
          <div class="legdone" style="color:${cur>=need?'#f0b0a6':'var(--dim)'}">${cur>=need?'ADMIRAL READY — ATTACK':'NOTORIETY '+cur+'/'+need}</div>`}
    </div>`;}).join('');
  $('main').innerHTML=`<div id="mapwrap">
    <svg id="mapsvg" viewBox="0 0 ${CW} ${CH}" preserveAspectRatio="none">
      <defs><radialGradient id="seabg" cx="45%" cy="40%" r="80%">
        <stop offset="0%" stop-color="#0e3a40"/><stop offset="55%" stop-color="#082830"/><stop offset="100%" stop-color="#04161c"/>
      </radialGradient></defs>
      <rect width="${CW}" height="${CH}" fill="url(#seabg)"/>
      <g transform="scale(${LSX},${LSY})" opacity=".85">
        <path d="M-10,470 Q60,430 120,462 Q180,494 250,470 Q320,448 370,478 L370,570 L-10,570 Z" fill="#0a2f2c"/>
        <path d="M-10,60 Q40,90 20,150 Q0,210 30,240 L-10,260 Z" fill="#0a2f2c"/>
        <path d="M300,-10 Q280,40 320,70 Q356,96 340,140 L370,150 L370,-10 Z" fill="#0a2f2c"/>
        <path d="M150,300 q14,-8 30,0 q10,8 -4,14 q-20,6 -26,-14 Z" fill="#0a2f2c"/>
        <path d="M210,380 q18,-6 30,4 q8,10 -8,13 q-22,3 -22,-17 Z" fill="#0a2f2c"/>
      </g>
      ${lines}${voyLines}
      <g><circle class="nodeglow" cx="${hx}" cy="${hy}" r="${19*NR}" fill="#d9c98a"/>
      <circle cx="${hx}" cy="${hy}" r="${7*NR}" fill="#d9c98a" stroke="#000" stroke-width="1.4"/>
      <text x="${hx}" y="${hy+24*NR+HLBL}" text-anchor="middle" fill="#d9c98a" font-size="${HLBL}" font-family="Oswald" letter-spacing="2" style="paint-order:stroke" stroke="#04161c" stroke-width="3">HOME PORT</text></g>
      ${nodes}${bossNodes}
    </svg>
    <div class="legend">${legend}</div>
    <div class="maphint">Green = open to trade · Blue = your ships at sea · Gold star = charter · Red star = admiral</div>
  </div>`;}
let mapRaf=0;
addEventListener('resize',()=>{if(tab==='routes'){cancelAnimationFrame(mapRaf);mapRaf=requestAnimationFrame(renderMap);}});

/* ============ AT SEA ============ */
function renderVoyages(){
  let i=0,h=`<div class="sect" style="--i:${i++}">Ships at Sea — ${S.voyages.length}/${VOY_MAX_ACTIVE}</div>`;
  if(!S.voyages.length){
    h+=`<div class="card" style="--i:${i++}"><div class="sub">No ships trading right now. Attack a trade or salvage lane until its danger drops to <b>Hazardous</b> or lower, then open it again and use the TRADE tab to send ships.</div></div>`;
    $('main').innerHTML=h;return;}
  S.voyages.slice().sort((a,b)=>a.endsAt-b.endsAt).forEach(v=>{
    const rdy=voyReady(v),tot=(v.endsAt-v.startedAt)/1000,left=(v.endsAt-now())/1000;
    const pct=Math.max(0,Math.min(100,(1-left/tot)*100));
    const crew=v.ships.map(id=>{const s=findShip(id);return s?s.name:'—';}).join(', ');
    h+=`<div class="card ${rdy?'ready':'atsea'}" style="--i:${i++}" data-voy="${v.id}">
      <div class="row"><h3>${v.routeName}</h3><span class="tag ${rdy?'t0':'blu'}">${rdy?'MADE PORT':'AT SEA'}</span></div>
      <div class="sub">${crew}</div>
      <div class="vbar ${rdy?'done':''}"><i style="width:${rdy?100:pct}%"></i></div>
      <div class="row" style="margin-top:8px">
        <span class="sub">Safe arrival <b>${v.odds}%</b> · Reward <b style="color:var(--goldhi)">${fmt(v.rew)}</b></span>
        <span class="clock ${rdy?'done':''}" data-endsat="${v.endsAt}">${rdy?'READY':fmtDur(left)}</span></div>
      <div class="row" style="margin-top:11px">
        ${rdy?`<button class="btn sm grn" onclick="collectVoyage('${v.id}')">Collect</button>`
             :`<button class="btn sm blu" onclick="rushVoyage('${v.id}')">Speed Up · ${iconHTML('gems',19)}${rushCost(v)}</button>`}
        ${rdy?'':`<button class="btn sm red" onclick="recallVoyage('${v.id}')">Call Back</button>`}
      </div></div>`;});
  $('main').innerHTML=h;}
function rushVoyage(id){const v=S.voyages.find(x=>x.id===id);if(!v)return;
  const c=rushCost(v);
  if(S.gems<c)return toast('Not enough gems to speed that up.','bad');
  S.gems-=c;v.endsAt=now();Snd.play('arrive');
  toast('Voyage rushed — the fleet is docking now.','blu');render();}
function recallVoyage(id){const v=S.voyages.find(x=>x.id===id);if(!v)return;
  if(!confirm('Call the fleet back? You lose the cargo and get no payment.'))return;
  S.voyages=S.voyages.filter(x=>x.id!==id);
  toast('Fleet recalled. Cargo and payment lost.','bad');render();}

function marketShipCard(t,price,fn,ok,i){const d=TYPES[t];
  return `<div class="card" style="--i:${i}"><div style="display:flex;gap:14px;align-items:center">
    <div class="fleetship">${shipHTML(t,'player',1.0)}</div>
    <div style="flex:1"><h3>${d.n}</h3>
      <div class="stats"><span>SPD <b>${d.speed}</b></span><span>GUNS <b>${d.guns}</b></span><span>HULL <b>${d.hull}</b></span><span>CARGO <b>${d.cargo}</b></span></div>
      <div style="margin-top:10px"><button class="btn sm gold" ${ok?'':'disabled'} onclick="${fn}">${price}</button></div>
    </div></div></div>`;}
function buyShip(t){if(S.ships.length>=S.docks)return toast('All berths are full. Buy an extra berth below first.','bad');
  S.reales-=TYPES[t].cost;S.ships.push(newShip(t));
  toast('A '+TYPES[t].n+' joins your fleet.','gold');render();}
function buildShip(t,r,p){if(S.ships.length>=S.docks)return toast('All berths are full. Buy an extra berth below first.','bad');
  S.reales-=r;S.parts-=p;S.ships.push(newShip(t));
  toast('Your '+TYPES[t].n+' is built and berthed.','gold');render();}
function buyCargo(n){const c=n*CARGO_PRICE;
  if(S.reales<c)return toast('Not enough reales — '+n+' units cost '+c+'.','bad');
  S.reales-=c;S.cargo+=n;
  toast('Bought '+n+' cargo units for '+c+' reales.','gold');render();}
function buyDock(){const c=350+(S.docks-2)*250,g=S.docks>=6?2:0;
  if(S.reales<c||S.gems<g)return toast('Not enough to pay for another berth.','bad');
  S.reales-=c;S.gems-=g;S.docks++;
  toast('New berth bought.','gold');render();}

/* ============ MISSION SHEET ============ */
let sel=[],curRoute=null,sheetMode='battle';
function openSheet(){const o=$('overlay');o.classList.add('on');requestAnimationFrame(()=>o.classList.add('vis'));}
function closeSheet(){const o=$('overlay');o.classList.remove('vis');
  setTimeout(()=>{o.classList.remove('on');},420);tutEvent('sheet:close');render();}
function openMission(id){
  if(tutActive()&&S.tut<=3&&id!=='c1'){toast('Tap the green marker near home port to continue.','bad');return;}
  const r=routeById(id);if(!r)return;
  curRoute=r;sel=[];sheetMode='battle';
  tutEvent('route:'+id);
  if(r.type==='boss')Snd.play('boss_horn');
  if(r.type==='charter')Snd.play('relic');
  drawMission();openSheet();}
function setMode(m){sheetMode=m;sel=[];drawMission();}
function prizeDesc(p){if(!p)return '';
  if(p.relic)return 'Relic: '+p.relic;
  if(p.boon)return 'Legendary refit: '+BOONS[p.boon].n;
  if(p.gems)return 'Treasure map worth '+p.gems+' gems';return '';}
function drawMission(){

      <div class="row"><b>${isF?iconHTML('flag',21)+' ':''}${s.name}</b>${i>-1?`<span class="slot ${sheetMode==='voyage'?'blu':''}">${slots[i]}</span>`:''}</div>
      <div class="sub">${tname(s)} · pwr ${power(s)} · hull ${Math.max(0,s.hull)}/${s.max} · cargo ${s.cargo}${crip?' · CRIPPLED':''}${atSea?' · AT SEA':''}</div></div>`;});
  const c=r.charterDef;
  let extraLine='';
  if(isCh){const others=chartersAt(c.loc).filter(x=>x.id!==c.id);
    extraLine=(c.dest?`Carry it through and the port of <b>${PORTS[c.dest].n}</b> opens to you for good. `:'')+
      (c.prize?`<b style="color:var(--goldhi)">${prizeDesc(c.prize)}</b>. `:'')+
      (others.length?`<span class="sub">Also on offer here: ${others.map(o=>`<a href="#" style="color:var(--gold)" onclick="event.preventDefault();openMission('ch_${o.id}')">${o.n}</a>`).join(', ')}</span>`:'');}
  $('sheetHead').innerHTML=`<div class="row"><h3>${r.n}</h3>
      <span class="tag ${isCh?'gold':'t'+d}">${isBoss?r.bossDef.title.toUpperCase():(isCh?'TIER '+c.t:DNAMES[d])}</span></div>
    <div class="dbar"><i style="width:${(d+1)*25}%;background:${DCOLORS[d]}"></i></div>
    ${!isBoss&&!isCh?`<div class="secbar ${d<=1?'clear':''}"><i style="width:${sec}%"></i></div>
      <div class="sub" style="margin-top:4px">Lane security ${Math.round(sec)}% — falls ${SEC_DECAY_PER_MIN}% every minute. Higher security means lower danger.</div>`:''}
    <div class="row" style="margin-top:8px"><span class="mtype ${isBoss?'boss':(isCh?'gold':'')}">${MTYPE[r.type].n}</span></div>
    <div class="sub" style="margin-top:6px;font-style:italic">${isBoss?r.bossDef.desc:MTYPE[r.type].tip}</div>`;
  let body='';
  if(voyable&&!isBoss&&!isCh){
    body+=`<div class="modetabs">
      <button id="modeBat" class="${sheetMode==='battle'?'on':''}" onclick="setMode('battle')">Attack</button>

  if(sheetMode==='voyage'){

    const odds=r.type==='salvage'?salvageChance(r,fh):tradeChance(r,fp);
    const cargoOK=!r.cargo||(cap>=r.cargo&&S.cargo>=r.cargo);
    const slotOK=S.voyages.length<VOY_MAX_ACTIVE, open=voyageOpen(r);
    body+=`<div class="sub" style="margin-bottom:10px">Pick up to three ships to send trading. They leave your fleet for the time shown below and cannot fight until they return.</div>
      <div id="shipPicks">${picks}</div>
      <div class="card" style="--i:1"><div class="sub">
        ${!open?`<b style="color:var(--org)">Traders will not sail here while the lane rates ${DNAMES[d].toLowerCase()}. Attack it first to bring the danger down.</b><br>`:''}
        ${already?`<b style="color:var(--blu)">You already have a fleet trading this lane.</b><br>`:''}
        Time away: <b>${fleet.length?fmtDur(dur):'—'}</b>${fleet.length?' of real time — faster ships get back sooner':''}<br>
        ${r.cargo?`Cargo: needs ${r.cargo} units · your ships can hold ${cap} · you own ${S.cargo}<br>`:''}
        ${r.type==='salvage'?`Chance of raising the wreck: <b>${odds}%</b> (your fleet hull ${fh} against ${r.hullreq} needed)<br>`:`Chance of arriving safely: <b>${fleet.length?odds+'%':'—'}</b> — fail and you lose the cargo<br>`}
        Notoriety on return: <b style="color:var(--gold)">+${notoGain(r)}</b> — fills the regional bar that summons the admiral<br>
        Reward: <b style="color:var(--goldhi)">${fmt(r.rew)}</b>${r.ship?` · you may also raise a wrecked ${TYPES[r.ship.type].n}`:''}${r.final?' · THE FINAL VOYAGE':''}</div></div>
      <div class="grid2">

  } else {
    const flagOK=!isBoss||sel.includes('FLAG');
    body+=`<div class="sub" style="margin-bottom:10px">Pick up to three ships. The order you pick sets their position in the line — tap order matters.${isBoss?' <b style="color:var(--goldhi)">Your flagship sails or nobody does.</b>':''}</div>
      <div id="shipPicks">${picks}</div>
      <div class="card ${isBoss?'bosscard':''}" style="--i:1"><div class="sub">
        Your fleet power <b style="color:${fp>=r.power?'var(--grn)':'var(--yel)'}">${fp}</b>${r.power?' — '+r.power+' recommended':''}<br>
        ${!isBoss&&!isCh?`Winning adds <b style="color:var(--gold)">+${SEC_PER_WIN}%</b> lane security, which lowers the danger rating<br>`:''}
        Notoriety on victory: <b style="color:var(--gold)">+${notoGain(r)}</b> — fills the regional bar that summons the admiral<br>
        Reward: <b style="color:var(--goldhi)">${fmt(r.rew)}</b>${isBoss&&r.bossDef.unlocks?' · opens '+REGIONS[r.bossDef.unlocks].n:''}</div></div>
      <div class="grid2">
        <button class="btn" onclick="closeSheet()">Cancel</button>
        <button class="btn ${isBoss?'red':'gold'}" id="sailBtn" ${sel.length&&flagOK?'':'disabled'} onclick="launchBattle()">${isCh?'Accept':'Attack'}</button></div>
      ${!flagOK?'<div class="sub center" style="margin-top:10px;color:var(--yel)">Admirals only fight your flagship. Add it to the line.</div>':''}`;}
  $('sheetBody').innerHTML=body;
  refreshTut();}
function togSel(id){const i=sel.indexOf(id);
  if(i>-1)sel.splice(i,1);else{if(sel.length>=3)return;sel.push(id);}
  if(sel.length>=2)tutEvent('ships:2');
  drawMission();}

/* ============ VOYAGE LAUNCH / COLLECT ============ */
function launchVoyage(){
  const r=curRoute,fleet=sel.map(findShip).filter(Boolean);
  if(!fleet.length||!voyageOpen(r))return;
  if(r.cargo)S.cargo-=r.cargo;
  const dur=voyDuration(r,fleet);
  const odds=r.type==='salvage'?salvageChance(r,fleetHull(fleet)):tradeChance(r,fleetPower(fleet));
  S.voyages.push({id:'v'+(voySeq++),routeId:r.id,routeName:r.n,region:r.region,type:r.type,
    ships:fleet.map(s=>s.id),startedAt:now(),endsAt:now()+dur*1000,
    odds,rew:r.rew,noto:notoGain(r),shipFind:r.ship||null});
  Snd.play('depart');
  toast('Fleet away. Back in '+fmtDur(dur)+'.','blu');
  tutEvent('voyage:launch');
  save();closeSheet();}
function collectVoyage(id){
  const v=S.voyages.find(x=>x.id===id);if(!v||!voyReady(v))return;
  S.voyages=S.voyages.filter(x=>x.id!==id);
  const fleet=v.ships.map(findShip).filter(Boolean);
  const success=Math.random()*100<v.odds;
  let msg='',captives=[],evt='';
  if(success){
    S.reales+=v.rew.reales||0;S.parts+=v.rew.parts||0;S.gems+=v.rew.gems||0;
    S.done[v.routeId]=(S.done[v.routeId]||0)+1;
    msg='The fleet docked with full holds. The run paid out.';
    if(v.shipFind&&Math.random()<v.shipFind.chance){
      captives.push({type:v.shipFind.type,derelict:true});
      msg='The fleet docked with full holds, towing a wreck they raised on the way.';}
    Snd.play('arrive');
  }else{
    const alive=fleet.filter(s=>s.hull>0&&!(hasFit('copper')&&s.id==='FLAG'));
    if(alive.length){const s=alive[Math.floor(Math.random()*alive.length)];
      const dm=Math.round(s.max*rnd(0.2,0.45));s.hull=Math.max(0,s.hull-dm);
      msg=`Raiders caught the fleet mid-passage and took the cargo. No payment, and the ${s.name} came home with ${dm} damage.`;}
    else msg='The cargo was lost at sea. No payment.';
    Snd.play('defeat');}
  if(Math.random()<0.3&&!tutActive()){
    const alive=fleet.filter(s=>s.hull>0&&!(hasFit('copper')&&s.id==='FLAG'));
    const roll=Math.random();
    if(roll<0.35&&alive.length){const s=alive[Math.floor(Math.random()*alive.length)];
      const dm=Math.max(1,Math.round(s.max*rnd(0.06,0.14)));s.hull=Math.max(0,s.hull-dm);
      evt=`A storm on the way home damaged the ${s.name} for ${dm}.`;}
    else if(roll<0.7){const cg=Math.floor(rnd(3,8));S.cargo+=cg;
      evt=`The fleet salvaged ${cg} cargo units from floating wreckage on the way home.`;}
    else evt='A red moon on the third night. The crew have opinions about it. Nothing came of it.';}
  let noto=0;
  if(success)noto=addNoto({region:v.region,id:v.routeId,type:v.type,danger:0},v.noto);
  showResult({id:v.routeId,n:v.routeName,region:v.region,type:v.type,rew:v.rew},success,msg,captives,evt,noto,'',true);}

/* ============ BATTLE LAUNCH ============ */
function launchBattle(){
  const r=curRoute,fleet=sel.map(findShip).filter(Boolean);
  const forcedTut=tutActive()&&S.tut<=6&&r.id==='c1';
  tutEvent('launch');
  $('overlay').classList.remove('vis');$('overlay').classList.remove('on');
  if(r.type==='boss'){const b=r.bossDef;
    wipe(()=>startBattle(fleet,bossEnemies(b),false,win=>{
      if(win)bossVictory(b,fleet);
      else showResult(r,false,`${b.n} still holds this water and knows your face now. Your line broke and ran, and she let you go — which is its own kind of message.`,[],'',0,'');},b));
    return;}
  if(r.type==='charter'){
    wipe(()=>startBattle(fleet,charterEnemies(r.charterDef),false,win=>{
      if(win)charterVictory(r,fleet);
      else showResult(r,false,'The commission goes unfulfilled and the man who offered it is not pleased. It stands, though. Refit and come back for it.',[],'',0,'');}));
    return;}
  wipe(()=>startBattle(fleet,forcedTut?tutEnemies():genEnemies(r),r.type==='escort'&&!forcedTut,win=>{
    if(win)battleVictory(r,fleet);
    else showResult(r,false,r.type==='escort'
      ?'They took the merchant out from under your guns and were over the horizon before you could come about. The charter is void and word will get around.'
      :'What is left of your line limps home under torn canvas. The lane is exactly as dangerous as it was this morning.',[],'',0,'');}));}
function bossEnemies(b){return b.ships.map(s=>({...s,max:s.hull,disabled:false,pal:'boss'}));}
function tutEnemies(){return [
  {type:'schooner',name:'Smuggler Skiff',hull:14,max:14,guns:2,speed:6,disabled:false},
  {type:'schooner',name:'Cutthroat Jib',hull:14,max:14,guns:2,speed:6,disabled:false}];}
function charterEnemies(c){const t=c.t;
  let comp=t<=2?['schooner','schooner']:t<=4?['schooner','brig']:t<=6?['brig','brig','schooner']:
    t<=8?['brig','frigate','brig']:['frigate','frigate','brig'];
  const mod=1+t*0.05,pool=[...ENAMES].sort(()=>Math.random()-.5);
  return comp.map((ty,i)=>{const b=TYPES[ty];
    return {type:ty,name:pool[i]||b.n,hull:Math.round(b.hull*mod),max:Math.round(b.hull*mod),
      guns:Math.round(b.guns*mod),speed:b.speed,disabled:false};});}
function genEnemies(r){
  const t=REGIONS[r.region].tier,d=Math.max(1,effDanger(r));
  let comp;
  if(d===1)comp=t>=3?['brig','brig']:['schooner',Math.random()<.5?'schooner':'brig'];
  else if(d===2)comp=t>=3?['brig','frigate','brig']:['brig','brig',Math.random()<.4?'frigate':'schooner'];
  else comp=t>=4?['frigate','manowar','frigate']:(t>=3?['frigate','frigate','brig']:['brig','frigate','brig']);
  if(r.type==='blockade')comp=comp.map(x=>x==='schooner'?'brig':x);
  const mod=1+(t-1)*0.12,pool=[...ENAMES].sort(()=>Math.random()-.5);
  return comp.map((ty,i)=>{const b=TYPES[ty];
    return {type:ty,name:pool[i]||b.n,hull:Math.round(b.hull*mod),max:Math.round(b.hull*mod),
      guns:Math.round(b.guns*mod),speed:b.speed,disabled:false};});}
function addNoto(r,forced){
  const rk=r.region,b=BOSSES[rk];if(!b||S.bossBeaten[rk])return 0;
  const before=S.noto[rk]||0;
  if(before>=b.noto)return 0;
  const g=forced||notoGain(r);
  S.noto[rk]=Math.min(b.noto,before+g);
  if(before<b.noto&&S.noto[rk]>=b.noto)
    setTimeout(()=>{Snd.play('boss_horn');toast(b.n+' has been provoked. The admiral is on the map — go and fight.','bad');},900);
  return g;}
function battleVictory(r,fleet){
  const before=effDanger(r);
  addSec(r.id,SEC_PER_WIN);
  const after=effDanger(r);
  S.reales+=r.rew.reales||0;S.parts+=r.rew.parts||0;S.gems+=r.rew.gems||0;
  S.done['bat_'+r.id]=(S.done['bat_'+r.id]||0)+1;
  const noto=addNoto(r);
  if(r.type==='patrol')S.patrol[r.region]=3;
  let msg=`The lane is clear. Its security is now ${Math.round(secNow(r.id))}%.`;
  if(after<before)msg+=` The danger rating has dropped to ${DNAMES[after].toLowerCase()}.`;
  if(canVoyage(r)&&after<=1&&before>1){msg+=' It is now safe enough to send trade runs along it.';
    setTimeout(()=>toast(r.n+' is safe enough to trade now.','gold'),800);}
  showResult(r,true,msg,BT.b.enemies.filter(e=>e.disabled),'',noto,'');}
function charterVictory(r,fleet){
  const c=r.charterDef;
  S.charters[c.id]=1;
  S.reales+=r.rew.reales;S.parts+=r.rew.parts;
  const noto=addNoto(r);
  let msg=`The commission is discharged and the paper signed off in front of witnesses. "${c.n}" is done.`,prizeMsg='';
  if(c.dest&&!S.ports.includes(c.dest)){
    S.ports.push(c.dest);
    msg+=` ${PORTS[c.dest].n} is charted, and a standing lane runs there now.`;
    setTimeout(()=>toast('New port charted: '+PORTS[c.dest].n,'gold'),800);}
  if(c.prize){
    if(c.prize.relic){S.relics.push(c.prize.relic);
      prizeMsg='Relic: '+c.prize.relic+" — it will look well enough in the captain's quarters.";
      setTimeout(()=>{Snd.play('relic');toast('Relic claimed: '+c.prize.relic,'gold');},1200);}
    if(c.prize.boon){S.flagBoons.push(c.prize.boon);syncFlag();
      prizeMsg='Refit: '+BOONS[c.prize.boon].n+' — '+BOONS[c.prize.boon].desc+', fitted aboard the '+S.flag.name+'.';
      setTimeout(()=>{Snd.play('upgrade');toast(BOONS[c.prize.boon].n+' fitted.','gold');},1200);}
    if(c.prize.gems){S.gems+=c.prize.gems;prizeMsg='A map came with the payment. Whatever it pointed at was worth '+c.prize.gems+' gems.';}}
  showResult(r,true,msg,BT.b.enemies.filter(e=>e.disabled),'',noto,prizeMsg);}
function bossVictory(b,fleet){
  S.bossBeaten[b.region]=true;
  S.reales+=b.rew.reales;S.parts+=b.rew.parts;S.gems+=b.rew.gems;
  let msg=`${b.n} strikes her colours with what is left of her upperworks on fire. The ${b.title} is broken, and every captain in these waters will know it by morning.`;
  if(b.unlocks&&!S.unlocked.includes(b.unlocks)){
    S.unlocked.push(b.unlocks);
    msg+=` The chart opens: ${REGIONS[b.unlocks].n} lies before you.`;
    setTimeout(()=>toast('New waters charted: '+REGIONS[b.unlocks].n,'gold'),800);}
  else if(!b.unlocks){msg+=' Nothing stands between you and the Grand Fleet Route now.';
    if(!S.won){S.won=true;setTimeout(()=>{Snd.play('victory');toast('The Grand Fleet Route lies open.','gold');},800);}}
  showResult(bossAsRoute(b),true,msg,BT.b.enemies.filter(e=>e.disabled&&!e.isBoss),'',0,'');}

/* ============ RESULT ============ */
function showResult(r,success,msg,captives,evt,noto,prizeMsg,fromVoyage){
  const isBoss=r.type==='boss',isCh=r.type==='charter';
  const title=success
    ?(isBoss?'Admiral Defeated':(isCh?'Charter Fulfilled':(fromVoyage?'Ships Returned':'Lane Swept')))
    :(isBoss?'Repulsed':(fromVoyage?'Run Lost':'Battle Lost'));
  let h=`<div class="sub center" style="font-size:15px;color:${success?'var(--grn)':'#e88a7a'};font-family:'Oswald';letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">${title}</div>
    <div class="sub center">${success?'<b style="color:var(--goldhi)">'+fmt(r.rew)+'</b> paid into the strongbox. ':''}${msg||''}</div>
    ${prizeMsg?`<div class="evt prize">${prizeMsg}</div>`:''}
    ${noto?`<div class="evt noto">Your name carries further in ${REGIONS[r.region].n} — notoriety +${noto}, now ${S.noto[r.region]||0} of ${BOSSES[r.region].noto}.</div>`:''}
    ${evt?`<div class="evt">${evt}</div>`:''}`;
  if(captives.length){
    h+=`<div class="sect" style="margin-top:14px;--i:1">Prizes of War</div>`;
    captives.forEach((e,i)=>{
      const t=TYPES[e.type],full=S.ships.length>=S.docks;
      h+=`<div class="card" style="--i:${i+2}" id="cap${i}"><div style="display:flex;gap:12px;align-items:center">
        <div>${shipHTML(e.type,e.pal==='boss'?'boss':'enemy',0.85)}</div>
        <div style="flex:1"><h3>${e.derelict?'Derelict':'Captured'} ${t.n}</h3>
        <div class="sub">Damaged, about a third of her hull left.<br>Keep: joins your fleet, needs a free berth. Scrap: ${t.salv} parts and 1 gem.${e.derelict?' No crew aboard to ransom.':' Ransom: '+t.ransom+' reales.'}</div></div></div>
        <div class="row" style="margin-top:10px;flex-wrap:wrap;gap:7px">
          <button class="btn sm gold" ${full?'disabled':''} onclick="capAct(${i},'capture','${e.type}')">Keep</button>
          <button class="btn sm" onclick="capAct(${i},'salvage','${e.type}')">Scrap</button>
          ${e.derelict?'':`<button class="btn sm" onclick="capAct(${i},'ransom','${e.type}')">Ransom</button>`}
          <button class="btn sm" onclick="capAct(${i},'ignore','${e.type}')">Let Go</button>
        </div>${full?'<div class="sub" style="color:var(--yel);margin-top:8px">No free berth. Scuttle a ship in Port, or buy a berth in the Market, to keep her.</div>':''}</div>`;});}
  h+=`<button class="btn gold wide" style="margin-top:12px" onclick="closeSheet()">Continue</button>`;
  $('sheetHead').innerHTML=`<h3>${r.n}</h3>`;
  $('sheetBody').innerHTML=h;openSheet();
  if(success&&r.rew.reales)setTimeout(()=>coinFly(Math.min(12,Math.ceil(r.rew.reales/200))),500);
  save();updateRes();refreshTut();}
function capAct(i,act,type){
  const t=TYPES[type],el=$('cap'+i);
  if(act==='capture'){
    if(S.ships.length>=S.docks)return toast('Every berth is full, Captain.','bad');
    S.ships.push(newShip(type,rnd(0.25,0.45)));
    el.querySelector('.sub').textContent='Added to your fleet, damaged. Repair her in Port.';
    toast('The '+t.n+' flies your colours now.','gold');}
  else if(act==='salvage'){S.parts+=t.salv;S.gems+=1;
    el.querySelector('.sub').textContent=`Scrapped for ${t.salv} parts and 1 gem.`;}
  else if(act==='ransom'){S.reales+=t.ransom;coinFly(6);

  else el.querySelector('.sub').textContent='Left to drift. Nothing gained.';

  muzzle(x,y,dir){

  fireShot(from,to,barrel,huge){

      const fo=this.find(from),to_=this.find(to);
      if(!fo||!to_){res();return;}
      const dir=fo.c.x<to_.c.x?1:-1;
      const sx=fo.c.x+dir*fo.dim.w*fo.scale*0.68,sy=fo.c.y;
      this.muzzle(sx,sy,dir);if(huge){this.muzzle(sx,sy-18,dir);this.muzzle(sx,sy+18,dir);}
      Snd.play('cannon');
      this.tweens.add({targets:fo.c,x:fo.c.x-dir*(huge?16:7),duration:huge?140:80,yoyo:true});
      const ball=this.add.image(sx,sy,(barrel||huge)?'soft':'px')
        .setScale(huge?.4:(barrel?.22:1.8)).setTint(huge?0xff5030:(barrel?0xff7030:0x222222)).setDepth(6);
      if(barrel||huge){ball.setBlendMode(Phaser.BlendModes.ADD);
        ball._trail=this.add.particles(0,0,'px',{follow:ball,speed:15,lifespan:300,quantity:2,frequency:20,
          scale:{start:huge?1.6:1,end:0},tint:[0xff8040,0xffc060],emitting:true}).setDepth(5);}
      const ex=to_.c.x-dir*to_.dim.w*to_.scale*0.3,ey=to_.c.y+rnd(-8,8);
      const mx=(sx+ex)/2,peak=Math.min(sy,ey)-rnd(40,80);

      this.tweens.add({targets:tw,t:1,duration:huge?620:(barrel?520:400),ease:'Sine.in',
        onUpdate:()=>{const t=tw.t;
          ball.x=(1-t)*(1-t)*sx+2*(1-t)*t*mx+t*t*ex;
          ball.y=(1-t)*(1-t)*sy+2*(1-t)*t*peak+t*t*ey;},

  hitFlash(o){
    this.tweens.addCounter({from:0,to:1,duration:120,yoyo:true,

  sink(o){

  shieldPulse(){BT.b.fleet.forEach(s=>{const o=this.find(s);if(!o||s.hull<=0)return;

  boardDash(from,to){return new Promise(res=>{

  spawnReinforcement(nd,deadData){return new Promise(res=>{

  retreatAnim(){BT.b.fleet.forEach((s,i)=>{const o=this.find(s);if(!o)return;

}
function ensurePhaser(cb){
  if(PG){cb();return;}
  PG=new Phaser.Game({type:Phaser.AUTO,parent:'phaserHost',transparent:true,
    scale:{mode:Phaser.Scale.RESIZE},scene:[]});
  PG.events.once('ready',()=>cb());}
function startBattle(fleet,enemies,escort,onEnd,boss){
  BT.b={fleet,enemies,onEnd,round:1,target:0,log:[],
    merchant:escort?{type:'merchant',name:'Merchant Rose',hull:40,max:40}:null,
    boss:boss||null,reinforce:(boss&&boss.reinforce)||0,
    reinfPool:(boss&&boss.reinforcements)?boss.reinforcements.slice():[],telegraph:false};
  BT.busy=false;
  if(hasFit('magazine'))S.barrels=Math.min(9,S.barrels+1);
  $('banner').classList.remove('on');
  $('battleScr').classList.add('on');
  $('battleScr').classList.toggle('boss',!!boss);
  Snd.ambience(true);
  if(boss)Snd.play('boss_horn');
  blog(boss?`${boss.n} puts her helm over and comes about to meet you. The ${boss.title}, in the flesh at last.`:
    (escort?'They came out of the haze on the convoy\'s blind quarter. Get between them and the merchant.':'Sails on the horizon, and not friendly ones. Beat to quarters.'),boss?'bad':'');
  drawHud();
  ensurePhaser(()=>{
    if(PG.scene.getScene('battle'))PG.scene.remove('battle');
    PG.scene.add('battle',BattleScene,true);refreshTut();});}
function blog(m,c){BT.b.log.push({m,c});if(BT.b.log.length>3)BT.b.log.shift();
  $('blog').innerHTML=BT.b.log.map(l=>`<div class="${l.c}">${l.m}</div>`).join('');}
function drawHud(){
  $('bTitle').textContent=(BT.b.boss?BT.b.boss.n+' — ':'Broadsides — ')+'Round '+BT.b.round;
  $('bHint').innerHTML=BT.b.telegraph
    ? `<span class="warn">${BT.b.boss.n} is running out her lower deck — BRACE</span>`
    : 'Tap an enemy to target it, then choose one order below';
  $('bcmds').innerHTML=`
    <button class="btn sm" onclick="cmd('focus')">Focus Fire</button>
    <button class="btn sm" onclick="cmd('volley')">Spread Fire</button>
    <button class="btn sm" ${S.barrels?'':'disabled'} onclick="cmd('barrels')">Fire Barrels (${S.barrels})</button>
    <button class="btn sm" onclick="cmd('brace')">Brace</button>
    <button class="btn sm" onclick="cmd('board')">Board</button>
    <button class="btn sm red" onclick="cmd('retreat')">Retreat</button>`;
  refreshTut();}
const aliveE=()=>BT.b.enemies.filter(e=>!e.disabled);
const aliveP=()=>BT.b.fleet.filter(s=>s.hull>0);
function retarget(){const b=BT.b;
  if(!b.enemies[b.target]||b.enemies[b.target].disabled){
    const ni=b.enemies.findIndex(e=>!e.disabled);
    if(ni>-1){b.target=ni;BT.scene&&BT.scene.setMarker(ni);}}}
async function maybeReinforce(dead){
  if(!gim('wolfpack')||BT.b.reinforce<=0)return;
  const tpl=BT.b.reinfPool.shift();if(!tpl)return;
  BT.b.reinforce--;
  const nd={...tpl,max:tpl.hull,disabled:false,pal:'boss'};
  BT.b.enemies.push(nd);
  blog(`Another sail cuts out of the fog where there was nothing — the ${nd.name} takes her place in the line.`,'bad');
  if(BT.scene)await BT.scene.spawnReinforcement(nd,dead);else await sleep(300);
  retarget();}
async function cmd(c){
  if(BT.busy)return;
  const b=BT.b,sc=BT.scene;
  BT.busy=true;$('bcmds').classList.add('busy');
  try{
    if(c==='retreat'){
      const sp=aliveP().reduce((a,s)=>a+s.speed,0)/Math.max(1,aliveP().length);
      if(Math.random()<Math.min(0.9,0.45+sp*0.04)){
        blog('You put the helm hard over and slip away under every stitch she carries.','good');
        sc&&sc.retreatAnim();Snd.play('sail');await sleep(750);return showBanner('escaped');}
      blog('The wind betrays you at exactly the wrong moment and they close the gap.','bad');
      await enemyPhase(false);return endRound();}
    if(c==='barrels'){if(S.barrels<1){BT.busy=false;$('bcmds').classList.remove('busy');return;}
      S.barrels--;updateRes();}
    const brace=c==='brace',barrel=c==='barrels';
    if(brace)sc&&sc.shieldPulse();
    if(c==='board'){
      const t=b.enemies[b.target],thr=hasFit('grapple')?0.55:0.40;
      if(gim('ironclad')){blog('The grapples clatter off iron plating and fall away into the water. There is no boarding that ship.','bad');}
      else if(!t||t.disabled||t.hull>t.max*thr){blog(`Too much hull left to board — get her below ${Math.round(thr*100)}% first.`,'bad');}
      else{
        const boarder=aliveP()[0];
        await (sc?sc.boardDash(boarder,t):sleep(300));
        if(Math.random()<(t.hull<t.max*0.15?0.75:0.55)){
          t.disabled=true;t.hull=Math.max(1,t.hull);
          blog(`${boarder.name}'s people go over the rail screaming and the ${t.name} strikes inside two minutes.`,'good');
          if(sc){const o=sc.find(t);sc.floatText(o.c.x,o.c.y-44,'TAKEN','#63c06a',24);sc.sink(o);}
          retarget();await maybeReinforce(t);
        }else{
          const dm=Math.round(t.guns*rnd(0.8,1.2));boarder.hull=Math.max(0,boarder.hull-dm);
          blog(`They were waiting at the rail with pikes. ${boarder.name} comes away with ${dm} and fewer hands.`,'bad');
          if(sc){const o=sc.find(boarder);sc.impact(o.c.x,o.c.y,dm,false);sc.hitFlash(o);sc.drawHp(o);
            if(boarder.hull<=0)sc.sink(o);}}}
    } else {
      for(const s of aliveP()){
        const shots=(s.id==='FLAG'&&hasFit('chase'))?2:1;
        for(let k=0;k<shots;k++){
          if(!aliveE().length)break;
          const slotI=b.fleet.indexOf(s);
          let t=c==='focus'?b.enemies[b.target]:aliveE()[Math.floor(Math.random()*aliveE().length)];
          if(!t||t.disabled)t=aliveE()[0];if(!t)break;
          const dmg=Math.round(s.guns*rnd(0.8,1.2)*(slotI===1?1.25:1)*(barrel?1.6:1)*(brace?0.5:1)*(k?0.6:1));
          const hit=await (sc?sc.fireShot(s,t,barrel):sleep(200));
          t.hull-=dmg;
          blog(fx(pick(HIT_P),s.name,t.name,dmg)+(k?' The chase guns speak after her.':''),'');
          if(sc&&hit){sc.impact(hit.x,hit.y,dmg,barrel);sc.hitFlash(hit.o);sc.drawHp(hit.o);}
          if(t.hull<=0&&!t.disabled){t.disabled=true;t.hull=0;
            blog(fx(pick(SINK),t.name),'good');
            if(sc)sc.sink(sc.find(t));
            retarget();await maybeReinforce(t);}
          await sleep(170);}}}
    if(!aliveE().length){await sleep(500);return showBanner('win');}
    await sleep(280);
    await enemyPhase(brace);
    endRound();
  }catch(e){console.error(e);endRound();}}
async function enemyPhase(brace){
  const b=BT.b,sc=BT.scene;
  if(b.telegraph){
    const bs=b.enemies.find(e=>e.isBoss&&!e.disabled);
    b.telegraph=false;
    if(bs){const ps=aliveP();
      if(ps.length){
        const t=ps.reduce((a,s)=>power(s)>power(a)?s:a);
        const dm=Math.round(bs.guns*2.6*(brace?0.42:1));
        const hit=await (sc?sc.fireShot(bs,t,false,true):sleep(300));
        t.hull=Math.max(0,t.hull-dm);
        if(sc)sc.flash(0xffb060);
        blog(`${bs.name} empties her lower deck in one long rolling crash — ${t.name} takes ${dm}.${brace?' Braced, thank God.':' Nothing was ready for it.'}`,'bad');
        if(sc&&hit){sc.impact(hit.x,hit.y,dm,true);sc.hitFlash(hit.o);sc.drawHp(hit.o);
          if(t.hull<=0){sc.sink(hit.o);blog(fx(pick(CRIP),t.name),'bad');}}
        await sleep(260);}}}
  for(const e of aliveE()){
    if(b.merchant&&b.merchant.hull>0&&Math.random()<0.3){
      const dm=Math.round(e.guns*rnd(0.6,1.0));
      const hit=await (sc?sc.fireShot(e,b.merchant,false):sleep(200));
      b.merchant.hull=Math.max(0,b.merchant.hull-dm);
      blog(`${e.name} ignores you entirely and puts her guns on the ${b.merchant.name} — ${dm}.`,'bad');
      if(sc&&hit){sc.impact(hit.x,hit.y,dm,false);sc.hitFlash(hit.o);sc.drawHp(hit.o);
        if(b.merchant.hull<=0){sc.sink(hit.o);blog(`The ${b.merchant.name} is going down by the bow and there is nothing to be done about it.`,'bad');}}
      await sleep(170);continue;}
    const ps=aliveP();if(!ps.length)break;
    let t=Math.random()<0.65?ps.reduce((a,s)=>power(s)>power(a)?s:a):ps[Math.floor(Math.random()*ps.length)];
    const dm=Math.round(e.guns*rnd(0.8,1.2)*(b.fleet.indexOf(t)===2?0.75:1)*(brace?0.5:1));
    const hit=await (sc?sc.fireShot(e,t,false):sleep(200));
    t.hull=Math.max(0,t.hull-dm);
    blog(fx(pick(HIT_E),e.name,t.name,dm),'bad');
    if(sc&&hit){sc.impact(hit.x,hit.y,dm,false);sc.hitFlash(hit.o);sc.drawHp(hit.o);
      if(t.hull<=0){sc.sink(hit.o);blog(fx(pick(CRIP),t.name),'bad');}}
    await sleep(170);}}
function endRound(){
  const b=BT.b;b.round++;
  if(b.merchant&&b.merchant.hull<=0){blog('The merchant is gone beneath the waves and your contract with her.','bad');return showBanner('loss');}
  if(!aliveP().length){blog('Your line is shattered and what is left is not answering signals.','bad');return showBanner('loss');}
  if(gim('broadside')&&b.round%3===0&&b.enemies.some(e=>e.isBoss&&!e.disabled)){
    b.telegraph=true;
    blog(`The gunports come up along ${b.boss.n}'s lower deck, one after another. Whatever comes next will not be survivable twice. BRACE.`,'bad');
    BT.scene&&BT.scene.telegraphFx();}
  BT.busy=false;$('bcmds').classList.remove('busy');
  drawHud();}
function showBanner(kind){
  const b=BT.b,el=$('banner'),win=kind==='win',isBoss=!!b.boss;
  refreshTut();
  if(win){S.barrels=Math.min(9,S.barrels+1);Snd.play('victory');}
  else if(kind==='loss')Snd.play('defeat');
  const cols={win:'var(--grn)',loss:'var(--red)',escaped:'var(--yel)'};
  const txt={win:isBoss?'Admiral Broken':'Victorious',loss:'Defeated',escaped:'Escaped'};
  let inner=`<div class="big" style="color:${cols[kind]}">${txt[kind]}</div>`;
  if(win){
    const prizes=b.enemies.filter(e=>e.disabled&&!e.isBoss).length;
    inner+=`<div class="rewrow"><span>${iconHTML('barrels',26)} +1 barrel</span><span>${iconHTML('anchor',26)} ${prizes} prize${prizes!==1?'s':''}</span>
      ${isBoss?`<span>${iconHTML('star',26)} ${b.boss.title}</span>`:''}</div>
      <div class="stat"><div class="lbl"><span>lane status</span><span style="color:var(--grn)">securing</span></div>
      <div class="dbar"><i id="secbarFx" style="width:100%;background:var(--red)"></i></div></div>`;}
  else if(kind==='loss')inner+=`<div class="sub" style="margin-top:10px">What is still afloat turns for home and the surgeons.</div>`;
  inner+=`<button class="btn gold" style="margin-top:22px;min-width:180px" onclick="endBattle('${kind}')">Continue</button>`;
  el.innerHTML=inner;el.classList.add('on');refreshTut();
  if(win)setTimeout(()=>{const s=$('secbarFx');if(s){s.style.width='28%';s.style.background='var(--grn)';}},120);
  save();updateRes();}
function endBattle(kind){
  $('banner').classList.remove('on');
  Snd.ambience(false);
  wipe(()=>{
    $('battleScr').classList.remove('on');$('battleScr').classList.remove('boss');
    if(PG&&PG.scene.getScene('battle'))PG.scene.remove('battle');
    if(kind==='win')tutEvent('battle:end');
    else if(tutActive()&&S.tut>=7&&S.tut<=9){S.tut=3;save();toast('Repair your ships in Port and try again.','bad');}
    BT.b.onEnd(kind==='win');
    save();updateRes();});}

/* ============ TICKER ============ */
let lastReady=0;
setInterval(()=>{
  if(!S)return;
  const rdy=readyCount();
  // update countdowns in place — never re-render from inside this loop
  document.querySelectorAll('.clock[data-endsat]').forEach(el=>{
    const left=(+el.dataset.endsat-now())/1000;
    if(left<=0){el.textContent='READY';el.classList.add('done');}
    else{el.textContent=fmtDur(left);el.classList.remove('done');}});
  document.querySelectorAll('.card[data-voy] .vbar i').forEach(i=>{
    const card=i.closest('.card[data-voy]'),v=S.voyages.find(x=>x.id===card.dataset.voy);
    if(!v)return;
    const tot=(v.endsAt-v.startedAt)/1000,left=(v.endsAt-now())/1000;
    i.style.width=Math.max(0,Math.min(100,(1-left/tot)*100))+'%';});
  // render exactly once, on the transition
  if(rdy>lastReady){
    Snd.play('arrive');
    toast('A fleet has docked. Collect the reward in At Sea.','blu');
    if(tab==='voy'||tab==='fleet')render();}
  lastReady=rdy;
  updateRes();
},1000);
setInterval(()=>{if(S)save();},15000);
addEventListener('visibilitychange',()=>{if(!document.hidden&&S){updateRes();
  if(tab==='voy'||tab==='fleet'||tab==='routes')render();}});

/* ============ BOOT ============ */
Promise.all([loadShipArt(),loadIconArt()]).then(()=>{
  buildResStrip();
  if(!load())newGame();else render();
  lastReady=readyCount();});
</script>
